<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UISP — Intelligent Image Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141009; --panel:#1c160e; --panel2:#241b10; --line:#3a2c17;
    --text:#ece2cd; --text-dim:#a2937a; --brass:#c9a24d; --brass-dim:#7d6532; --brass-bright:#e2c26e;
    --ink:#0c0906; --serif:'Fraunces', Georgia, serif; --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif; --radius:3px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); font-family:var(--sans); overflow:hidden; }
  .app{ display:flex; flex-direction:column; height:100%; }

  header{
    display:flex; align-items:baseline; gap:16px; padding:16px 22px 14px; border-bottom:1px solid var(--line);
    background:linear-gradient(var(--panel), var(--bg)); flex-wrap:wrap;
  }
  .scene-id{
    font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--brass);
    border:1px solid var(--brass-dim); border-radius:2px; padding:3px 7px; white-space:nowrap;
  }
  header h1{ font-family:var(--serif); font-weight:600; font-size:22px; margin:0; letter-spacing:.01em; }
  header p{ margin:0; color:var(--text-dim); font-size:12.5px; max-width:520px; line-height:1.5; }

  .body{ flex:1; display:flex; min-height:0; }
  aside{ width:270px; flex:none; border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside h2{ font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); margin:0; padding:14px 16px 8px; }
  .search-wrap{ padding:0 16px 12px; }
  .search-wrap input{ width:100%; background:var(--ink); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:var(--radius); font-family:var(--sans); font-size:13px; }
  .search-wrap input:focus-visible{ outline:2px solid var(--brass); outline-offset:1px; }
  .catalog-list{ flex:1; overflow-y:auto; padding:0 10px 14px; }
  .catalog-item{ width:100%; text-align:left; background:transparent; border:1px solid transparent; border-radius:var(--radius); padding:9px 8px; cursor:pointer; display:block; color:var(--text); font-family:var(--sans); margin-bottom:2px; }
  .catalog-item:hover{ background:var(--panel2); }
  .catalog-item.active{ background:var(--panel2); border-color:var(--brass-dim); }
  .catalog-item .cid{ font-family:var(--mono); font-size:10px; color:var(--brass); display:block; margin-bottom:2px; }
  .catalog-item .clabel{ font-size:13px; font-weight:500; }
  .catalog-item .ctype{ font-size:11px; color:var(--text-dim); text-transform:capitalize; }
  .catalog-item.dim{ opacity:.35; }
  .catalog-item:focus-visible{ outline:2px solid var(--brass); outline-offset:-1px; }

  .stage-wrap{ flex:1; position:relative; min-width:0; background:radial-gradient(ellipse at 50% 30%, #1a140c 0%, var(--bg) 70%); }
  .toolbar{ position:absolute; top:14px; right:14px; z-index:5; display:flex; gap:6px; background:rgba(20,16,9,.85); border:1px solid var(--line); border-radius:6px; padding:5px; backdrop-filter:blur(4px); }
  .toolbar button{ width:30px; height:30px; border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:4px; cursor:pointer; font-family:var(--mono); font-size:14px; line-height:1; }
  .toolbar button:hover{ border-color:var(--brass-dim); color:var(--brass-bright); }
  .toolbar button:focus-visible{ outline:2px solid var(--brass); }

  #osd{ position:absolute; inset:0; background:transparent; }
  .openseadragon-canvas{ outline:none; }

  .pin{ width:26px; height:26px; margin:0; padding:0; border:none; background:none; cursor:pointer; transform-origin:center; }
  .pin .ring{ width:26px; height:26px; border-radius:50%; border:1.5px solid var(--brass); background:rgba(201,162,77,.18); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:10px; color:var(--brass-bright); transition:background .15s, transform .15s; backdrop-filter:blur(1px); }
  .pin:hover .ring, .pin:focus-visible .ring{ background:rgba(201,162,77,.5); transform:scale(1.12); }
  .pin:focus-visible{ outline:none; }
  .pin:focus-visible .ring{ box-shadow:0 0 0 2px var(--brass); }
  .pin.active .ring{ background:var(--brass); color:var(--ink); }
  .pin.pulse .ring{ animation:pulse 1.1s ease-out 2; }
  .pin.dim{ opacity:.2; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(226,194,110,.65); } 100%{ box-shadow:0 0 0 16px rgba(226,194,110,0); } }
  @media (prefers-reduced-motion: reduce){ .pin.pulse .ring{ animation:none; } }

  #annotation{ position:absolute; left:14px; bottom:14px; width:300px; max-width:calc(100% - 28px); background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px 16px; box-shadow:0 8px 24px rgba(0,0,0,.4); display:none; z-index:6; }
  #annotation.show{ display:block; }
  #annotation .aid{ font-family:var(--mono); font-size:10px; color:var(--brass); }
  #annotation h3{ font-family:var(--serif); font-size:17px; margin:4px 0 2px; }
  #annotation .atype{ font-size:11px; color:var(--text-dim); text-transform:capitalize; margin-bottom:8px; display:block; }
  #annotation p{ font-size:13px; line-height:1.55; color:var(--text); margin:0 0 10px; }
  #annotation .arow{ display:flex; gap:8px; flex-wrap:wrap; }
  #annotation button{ font-family:var(--sans); font-size:12px; border-radius:4px; padding:6px 10px; cursor:pointer; border:1px solid var(--line); background:var(--panel2); color:var(--text); }
  #annotation button.primary{ background:var(--brass); color:var(--ink); border-color:var(--brass); font-weight:600; }
  #annotation button:hover{ border-color:var(--brass-dim); }
  #annotation .close{ position:absolute; top:8px; right:10px; border:none; background:none; color:var(--text-dim); font-size:16px; cursor:pointer; }

  .hint{ position:absolute; left:14px; top:14px; z-index:5; font-family:var(--mono); font-size:10.5px; color:var(--text-dim); background:rgba(20,16,9,.7); border:1px solid var(--line); border-radius:4px; padding:5px 9px; pointer-events:none; }
  #coord-toast{ position:absolute; left:14px; bottom:14px; z-index:7; font-family:var(--mono); font-size:12px; color:var(--ink); background:var(--brass); border-radius:4px; padding:6px 10px; opacity:0; transition:opacity .2s; pointer-events:none; }

  #loading{ position:absolute; inset:0; z-index:9; display:flex; align-items:center; justify-content:center; background:var(--bg); flex-direction:column; gap:10px; }
  #loading .spinner{ width:28px; height:28px; border:2.5px solid var(--line); border-top-color:var(--brass); border-radius:50%; animation:spin .8s linear infinite; }
  #loading span{ font-family:var(--mono); font-size:11px; color:var(--text-dim); }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  #load-error{ position:absolute; inset:0; z-index:8; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:40px; }
  #load-error .box{ max-width:460px; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:22px 26px; text-align:left; }
  #load-error h3{ font-family:var(--serif); font-size:18px; margin:0 0 10px; color:var(--brass-bright); }
  #load-error p{ font-size:13px; line-height:1.6; color:var(--text-dim); margin:0 0 10px; }
  #load-error code{ background:var(--ink); color:var(--brass-bright); padding:2px 6px; border-radius:3px; font-family:var(--mono); font-size:12px; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="scene-id" id="scene-id">SCENE —</span>
    <div>
      <h1 id="scene-title">Loading…</h1>
      <p id="scene-desc"></p>
    </div>
  </header>

  <div class="body">
    <aside>
      <h2>Catalog</h2>
      <div class="search-wrap"><input id="search" type="text" placeholder="Search objects…" aria-label="Search scene objects"></div>
      <div class="catalog-list" id="catalog-list"></div>
    </aside>

    <div class="stage-wrap">
      <div class="hint">drag to pan · scroll / pinch to zoom · shift+click to copy coordinates</div>
      <div id="coord-toast"></div>
      <div class="toolbar">
        <button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button>
        <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="fit" title="Fit to screen" aria-label="Fit to screen">⤢</button>
      </div>
      <div id="loading"><div class="spinner"></div><span>Loading scene…</span></div>
      <div id="load-error" style="display:none;"></div>
      <div id="osd"></div>
      <div id="annotation">
        <button class="close" id="ann-close" aria-label="Close">✕</button>
        <span class="aid" id="ann-id"></span>
        <h3 id="ann-title"></h3>
        <span class="atype" id="ann-type"></span>
        <p id="ann-desc"></p>
        <div class="arow" id="ann-actions"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/openseadragon.min.js"></script>
<script>
/* ============================================================
   The one canonical UISP viewer. Implements the renderer-agnostic
   Scene.* API from SCENE_SPEC.md (load / goto / highlight / find /
   search). Rendering is backed by OpenSeadragon, which transparently
   handles both plain images and deep-zoom tile pyramids from the
   same media.src field — scene.json never needs to say which kind
   it is. This consolidates what were previously two separate files
   (a CSS-transform viewer for flat images, a deep-zoom-specific one)
   into one, now that both cases are provably handled by one engine.
   ============================================================ */
const annEl = document.getElementById('annotation');
const listEl = document.getElementById('catalog-list');
const searchEl = document.getElementById('search');
const loadingEl = document.getElementById('loading');

let scene = null;
let SCENE_W = 1, SCENE_H = 1;
let pins = {};
let osdViewer = null;

const FOCUS_ZOOM_FACTOR = 2.4; // how much closer than "fit" Scene.goto zooms in

function prefersReducedMotion(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

// OpenSeadragon only auto-resolves a bare string URL for tile-pyramid
// descriptors (.dzi, .xml, legacy .js pyramids, IIIF info.json). A plain
// raster image needs to be wrapped explicitly, or it silently fails to
// open. This is the one place that distinction lives — everywhere else
// in this file just deals with "the scene's image," tiled or not.
function resolveTileSource(src){
  if (/\.(dzi|xml|js)(\?|$)/i.test(src) || /info\.json(\?|$)/i.test(src)) return src;
  return { type: 'image', url: src };
}

const Scene = {
  load(data){
    return new Promise((resolve, reject) => {
      scene = data;
      document.getElementById('scene-title').textContent = data.title;
      document.getElementById('scene-desc').textContent = data.description;
      document.getElementById('scene-id').textContent = 'SCENE · ' + (data.media[0].id || '001').toUpperCase();

      osdViewer = OpenSeadragon({
        id: "osd",
        prefixUrl: "https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/images/",
        tileSources: resolveTileSource(data.media[0].src),
        showNavigator: true,
        navigatorPosition: "BOTTOM_RIGHT",
        animationTime: prefersReducedMotion() ? 0 : 0.6,
        springStiffness: 8,
        gestureSettingsMouse: { clickToZoom: false },
        visibilityRatio: 1
      });

      osdViewer.addHandler('open', () => {
        const src = osdViewer.world.getItemAt(0).source;
        SCENE_W = src.dimensions ? src.dimensions.x : src.width;
        SCENE_H = src.dimensions ? src.dimensions.y : src.height;
        pins = {};
        data.objects.forEach(obj => buildPin(obj));
        buildCatalog(data.objects);
        loadingEl.style.display = 'none';
        wireInteractions();
        resolve();
      });
      osdViewer.addHandler('open-failed', e => reject(new Error(e.message || 'Could not open the image/tile source.')));
    });
  },
  find(tag){ return scene.objects.filter(o => (o.tags||[]).includes(tag)); },
  search(text){
    const q = text.trim().toLowerCase();
    const matches = !q ? scene.objects : scene.objects.filter(o =>
      o.label.toLowerCase().includes(q) || (o.description||'').toLowerCase().includes(q) || (o.tags||[]).some(t=>t.includes(q)));
    const matchIds = new Set(matches.map(o=>o.id));
    scene.objects.forEach(o => {
      const dim = q && !matchIds.has(o.id);
      pins[o.id]?.overlayEl.classList.toggle('dim', dim);
      const item = listEl.querySelector(`[data-id="${o.id}"]`);
      if(item) item.classList.toggle('dim', dim);
    });
    return matches;
  },
  highlight(id){
    const pin = pins[id];
    if(!pin) return;
    pin.overlayEl.classList.remove('pulse'); void pin.overlayEl.offsetWidth; pin.overlayEl.classList.add('pulse');
  },
  goto(id){
    const obj = scene.objects.find(o=>o.id===id);
    if(!obj || !osdViewer) return;
    const point = new OpenSeadragon.Point(obj.location.x*SCENE_W, obj.location.y*SCENE_H);
    const viewportPoint = osdViewer.viewport.imageToViewportCoordinates(point);
    const targetZoom = Math.max(osdViewer.viewport.getZoom(), osdViewer.viewport.getHomeZoom()*FOCUS_ZOOM_FACTOR);
    osdViewer.viewport.panTo(viewportPoint, prefersReducedMotion());
    osdViewer.viewport.zoomTo(targetZoom, viewportPoint, prefersReducedMotion());
    Scene.highlight(id);
  },
  open(id){
    const obj = scene.objects.find(o=>o.id===id);
    const url = obj?.links?.url || obj?.links?.wikipedia;
    if(url) window.open(url, '_blank', 'noopener');
  }
};
window.Scene = Scene;

function buildPin(obj){
  const btn = document.createElement('button');
  btn.className = 'pin';
  btn.setAttribute('aria-label', obj.label);
  btn.innerHTML = `<span class="ring">${catalogNo(obj)}</span>`;
  btn.addEventListener('click', () => activate(obj.id));

  const point = new OpenSeadragon.Point(obj.location.x*SCENE_W, obj.location.y*SCENE_H);
  const viewportPoint = osdViewer.viewport.imageToViewportCoordinates(point);
  osdViewer.addOverlay({ element: btn, location: viewportPoint, placement: OpenSeadragon.Placement.CENTER });

  pins[obj.id] = { overlayEl: btn };
}

function catalogNo(obj){ const i = scene.objects.findIndex(o=>o.id===obj.id); return String(i+1).padStart(2,'0'); }

function buildCatalog(objects){
  listEl.innerHTML = '';
  objects.forEach((obj, i) => {
    const item = document.createElement('button');
    item.className = 'catalog-item';
    item.dataset.id = obj.id;
    item.innerHTML = `<span class="cid">OBJ.${String(i+1).padStart(2,'0')} — ${obj.id}</span>
      <span class="clabel">${obj.label}</span><br><span class="ctype">${obj.type}</span>`;
    item.addEventListener('click', () => activate(obj.id));
    listEl.appendChild(item);
  });
}

/* ---------------- annotation + URL deep-linking (identical to Phase 1) ---------------- */
function objectURL(id){
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('object', id);
  return url.toString();
}

function applyActivation(id){
  const obj = scene.objects.find(o=>o.id===id);
  if(!obj) return;
  document.querySelectorAll('.pin.active').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.catalog-item.active').forEach(p=>p.classList.remove('active'));
  pins[id].overlayEl.classList.add('active');
  const item = listEl.querySelector(`[data-id="${id}"]`);
  if(item) item.classList.add('active');

  Scene.goto(id);

  document.getElementById('ann-id').textContent = 'OBJ.' + catalogNo(obj) + ' · ' + obj.id;
  document.getElementById('ann-title').textContent = obj.label;
  document.getElementById('ann-type').textContent = obj.type;
  document.getElementById('ann-desc').textContent = obj.description || '';
  const actions = document.getElementById('ann-actions');
  actions.innerHTML = '';
  const link = obj.links?.url || obj.links?.wikipedia;
  if((obj.actions||[]).includes('openURL') && link){
    const b = document.createElement('button');
    b.textContent = 'Learn more ↗'; b.className='primary';
    b.addEventListener('click', ()=>Scene.open(obj.id));
    actions.appendChild(b);
  }
  const b2 = document.createElement('button');
  b2.textContent = 'Re-center';
  b2.addEventListener('click', ()=>Scene.goto(obj.id));
  actions.appendChild(b2);

  const b3 = document.createElement('button');
  b3.textContent = 'Copy link';
  b3.addEventListener('click', ()=>{
    navigator.clipboard?.writeText(objectURL(id)).then(()=>{
      b3.textContent = 'Copied!';
      setTimeout(()=>{ b3.textContent = 'Copy link'; }, 1400);
    }).catch(()=>{});
  });
  actions.appendChild(b3);

  annEl.classList.add('show');
}

function activate(id){ applyActivation(id); history.pushState({ object:id }, '', objectURL(id)); }
function clearActive(){
  document.querySelectorAll('.pin.active').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.catalog-item.active').forEach(p=>p.classList.remove('active'));
  annEl.classList.remove('show');
}
function closeAnnotation(){
  clearActive();
  const url = new URL(window.location.href); url.search = '';
  history.pushState({}, '', url.toString());
}
window.addEventListener('popstate', ()=>{
  const id = new URLSearchParams(window.location.search).get('object');
  if(id && scene && scene.objects.find(o=>o.id===id)) applyActivation(id);
  else clearActive();
});
document.getElementById('ann-close').addEventListener('click', closeAnnotation);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeAnnotation(); });
searchEl.addEventListener('input', ()=>Scene.search(searchEl.value));

/* ---------------- toolbar + shift-click coordinate picker ---------------- */
function wireInteractions(){
  document.getElementById('zoom-in').addEventListener('click', ()=> osdViewer.viewport.zoomBy(1.3));
  document.getElementById('zoom-out').addEventListener('click', ()=> osdViewer.viewport.zoomBy(1/1.3));
  document.getElementById('fit').addEventListener('click', ()=> osdViewer.viewport.goHome());

  osdViewer.addHandler('canvas-click', e => {
    if(!e.originalEvent.shiftKey || e.quick === false) return;
    const viewportPoint = osdViewer.viewport.pointFromPixel(e.position);
    const imagePoint = osdViewer.viewport.viewportToImageCoordinates(viewportPoint);
    const nx = clamp(imagePoint.x / SCENE_W, 0, 1), ny = clamp(imagePoint.y / SCENE_H, 0, 1);
    navigator.clipboard?.writeText(`${nx.toFixed(3)}, ${ny.toFixed(3)}`).catch(()=>{});
    const toast = document.getElementById('coord-toast');
    toast.textContent = `x: ${nx.toFixed(3)}  y: ${ny.toFixed(3)}  (copied)`;
    toast.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(()=>{ toast.style.opacity = '0'; }, 1800);
  });
}

/* ---------------- init ---------------- */
async function init(){
  try {
    const res = await fetch('scene.json');
    if(!res.ok) throw new Error(`scene.json responded with HTTP ${res.status}`);
    const data = await res.json();
    await Scene.load(data);
  } catch (err) {
    console.error(err);
    loadingEl.style.display = 'none';
    document.getElementById('load-error').style.display = 'flex';
    document.getElementById('load-error').innerHTML = `
      <div class="box">
        <h3>Couldn't load the scene</h3>
        <p>${escapeHtml(err.message)}</p>
        <p>If you opened this file directly (double-clicked it), browsers block <code>fetch()</code>
           of local files for security reasons. Serve the folder instead, e.g. from a terminal in
           this folder:</p>
        <p><code>python3 -m http.server 8000</code></p>
        <p>…then open <code>http://localhost:8000/viewer.html</code>. Also make sure
           <code>scene.json</code> and the image it references (a plain image, or a
           .dzi tile pyramid + its _files folder) are in the same folder as this file.</p>
      </div>`;
  }
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

init();
</script>
</body>
</html>
