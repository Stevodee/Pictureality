<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pictureality admin (PSV)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.7.1/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.7.1/index.css">
<style>
  :root { --bg:#0b0d10; --panel:#14171c; --line:#262b33; --text:#e8e6df; --dim:#8b9099; --accent:#d98a3d; --bad:#e0705a; --good:#5a9e6f; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.45 -apple-system,BlinkMacSystemFont,sans-serif; }
  #app { display:grid; grid-template-columns:230px 1fr 350px; grid-template-rows:auto 1fr; height:100%; }
  header { grid-column:1/4; display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  input, select { background:#1a1e25; border:1px solid var(--line); color:var(--text); padding:5px 7px; border-radius:4px; font:12px ui-monospace,monospace; }
  button { background:var(--accent); color:#1a1206; border:0; border-radius:4px; padding:6px 11px; font-weight:600; cursor:pointer; }
  button.sec { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #list { overflow:auto; background:var(--panel); border-right:1px solid var(--line); }
  #list div { padding:6px 10px; border-bottom:1px solid var(--line); cursor:pointer; font:12px ui-monospace,monospace; display:flex; justify-content:space-between; gap:6px; }
  #list div.on { background:#222831; }
  #list div span:first-child { font:13px -apple-system,BlinkMacSystemFont,sans-serif; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #list .nb { color:var(--bad); } #list .b { color:var(--dim); }
  #viewerwrap { position:relative; min-height:0; }
  #viewer { position:absolute; inset:0; }
  #msg { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:5; max-width:70%; text-align:center; background:rgba(0,0,0,.72); padding:8px 14px; border-radius:8px; font:600 15px/1.35 -apple-system,BlinkMacSystemFont,sans-serif; cursor:pointer; }
  #side { overflow:auto; background:var(--panel); border-left:1px solid var(--line); padding:10px 12px; }
  h3 { font:600 11px ui-monospace,monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin:14px 0 6px; }
  h3.error { color:var(--bad); } h3.warn { color:var(--accent); }
  label { display:block; font-size:11px; color:var(--dim); margin:6px 0 2px; }
  .f { padding:4px 0; border-bottom:1px solid var(--line); font:11px ui-monospace,monospace; cursor:pointer; }
  .ok { color:var(--good); } .dim { color:var(--dim); }
  .hs { width:32px; height:32px; border-radius:50%; background:rgba(217,138,61,.92); border:3px solid #000; box-shadow:0 0 0 2px #fff; }
  .f button { padding:2px 7px; font-size:11px; margin-left:4px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .mobonly { display:none; }
  #sheethandle { display:none; }
  @media (max-width: 800px) {
    #app { display:flex; flex-direction:column; height:100dvh; }
    header { gap:6px; padding:6px 8px; }
    header .title { display:none; }
    .mobonly { display:inline-flex; gap:4px; align-items:center; }
    .nav { flex:1; min-width:0; } .nav select { flex:1; min-width:0; }
    .adv { display:none; flex-basis:100%; flex-wrap:wrap; gap:6px; align-items:center; }
    header.showadv .adv { display:flex; }
    #status { flex-basis:100%; font-size:11px; }
    #list { display:none; }
    #viewerwrap { flex:1; min-height:0; }
    #side { position:fixed; left:0; right:0; bottom:0; z-index:20; max-height:58dvh; overflow:auto; border-left:0;
            border-top:1px solid var(--line); transform:translateY(calc(100% - 44px)); transition:transform .2s; padding-top:0; }
    #side.open { transform:none; }
    #sheethandle { display:block; position:sticky; top:0; z-index:2; height:44px; margin:0 -12px; padding:13px 12px;
                   background:var(--panel); border-bottom:1px solid var(--line); cursor:pointer;
                   font:12px ui-monospace,monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    input, select, button { font-size:16px; min-height:38px; }
    .f { padding:9px 0; }
    .psv-navbar { bottom:48px !important; }
  }
  .hs svg { width:100%; height:100%; padding:6px; box-sizing:border-box; fill:none; stroke:#1a1206; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5.7.1/index.module.js",
  "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5.7.1/index.module.js"
} }
</script>
</head>
<body>
<div id="app">
  <header>
    <button id="menubtn" class="sec mobonly">&#9776;</button>
    <b class="title">Pictureality admin</b>
    <span class="adv">tour <input id="tour" size="16" placeholder="campell-house">
    <button id="load">Load</button>
    <span class="dim">|</span>
    repo <input id="owner" size="9" value="Stevodee"> / <input id="repo" size="10" value="Pictureality">
    token <input id="token" type="password" size="14" placeholder="only needed to save">
    <select id="source"><option value="github">read from GitHub</option><option value="local">read from this server</option></select></span>
    <span class="mobonly nav"><button id="mprev" class="sec">&#9664;</button><select id="pano"></select><button id="mnext" class="sec">&#9654;</button></span>
    <button id="save" disabled>Save</button>
    <span id="status" class="dim"></span>
  </header>
  <div id="list"></div>
  <div id="viewerwrap"><div id="viewer"></div><div id="msg">load a tour</div></div>
  <div id="side">
    <div id="sheethandle"></div>
    <h3>Orient</h3>
    <div id="cur" class="dim">no pano open</div>
    <label>Clicked spot: bearing (0–360°)</label>
    <input id="bearing" type="number" step="0.1" min="0" max="360" style="width:100px">
    <span class="row" style="display:inline-flex;margin:0 0 0 6px"><button class="sec" data-b="0">N</button><button class="sec" data-b="90">E</button><button class="sec" data-b="180">S</button><button class="sec" data-b="270">W</button></span>
    <label>Reference</label>
    <select id="ref"><option value="true">true north (map)</option><option value="magnetic">magnetic (compass)</option></select>
    <select id="src"><option value="manual-landmark">map / landmark</option><option value="manual-compass">compass on site</option></select>
    <div class="row"><button id="apply">Apply</button><button class="sec" id="prev">&#9664; Prev</button><button class="sec" id="next">Next &#9654;</button></div>
    <div id="picked" class="dim" style="margin-top:6px">click the panorama to pick a spot</div>
    <h3>Hotspots</h3>
    <label><input type="checkbox" id="hophs" checked> tap a marker to hop to its pano</label>
    <div id="hslist"></div>
    <label>Add a hotspot at the clicked spot</label>
    <select id="hstarget"></select>
    <select id="hsvariant"><option>door</option><option>stairs</option><option>ground</option><option>room</option></select>
    <div class="row"><button id="hsadd">Add hotspot</button></div>
    <div class="dim" style="margin-top:4px">Move: press Move, then click the new spot.</div>
    <h3>Validate</h3>
    <label>Start scene (reachability)</label>
    <input id="start" style="width:100%" placeholder="blank = first in tour">
    <div id="findings"></div>
  </div>
</div>

<script type="module">
  import { Viewer } from '@photo-sphere-viewer/core';
  import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';

  const $ = id => document.getElementById(id);
  const srcUrl = u => $('source').value === 'github'
    ? `https://raw.githubusercontent.com/${$('owner').value.trim()}/${$('repo').value.trim()}/main/${u}?cb=${Date.now()}` : u;
  const J = async u => { const r = await fetch(srcUrl(u), { cache: 'no-store' }); if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); };
  const wrap = d => ((d + 180) % 360 + 360) % 360 - 180;
  const norm = d => ((d % 360) + 360) % 360;
  const deg = r => r * 180 / Math.PI;
  // Marker icons: inline SVG per hotspot variant (no hosted images). Re-created; the old Panolens canvas icons were not available.
  const ICONS = {
    door: '<svg viewBox="0 0 24 24"><path d="M7 21V4h10v17M5 21h14"/><circle cx="14.5" cy="12.5" r="1.2" fill="#1a1206" stroke="none"/></svg>',
    stairs: '<svg viewBox="0 0 24 24"><path d="M4 20h4v-4h4v-4h4V8h4"/></svg>',
    info: '<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="1.4" fill="#1a1206" stroke="none"/><path d="M12 11v7"/></svg>'
  };
  ICONS.ground = '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="8" ry="4"/><ellipse cx="12" cy="14" rx="3" ry="1.5" fill="#1a1206" stroke="none"/></svg>';
  ICONS.room = '<svg viewBox="0 0 24 24"><path d="M9 20H4V5h16v15h-5"/><circle cx="12" cy="12" r="1.6" fill="#1a1206" stroke="none"/></svg>';
  const markerHTML = v => `<div class="hs">${ICONS[v] || ICONS.door}</div>`;


  let TOKEN = '';          // session only: never written to disk, storage or cookies
  let S = {}, ids = [], tour = '', cur = null, picked = null, viewer = null, movingIdx = null;
  let viewerReady = false, pendingDraw = null, arrivalFor = null;
  const dirtyScenes = new Set();
  const dirty = new Set();

  const status = (m, bad) => { $('status').textContent = m; $('status').style.color = bad ? 'var(--bad)' : 'var(--dim)'; };

  // ---------- load ----------
  async function loadTour(t) {
    status('loading…');
    try {
      ids = (await J(`tours/${t}.json`)).scenes; tour = t; S = {}; dirty.clear(); dirtyScenes.clear();
      for (const id of ids) {
        let sc = null, desc = null;
        try { sc = await J(`scenes/${id}.json`); desc = await J(sc.media[0].descriptor); } catch (e) {}
        S[id] = { sc, desc, path: sc && sc.media[0].descriptor };
      }
    } catch (e) { status('cannot load tour: ' + e.message, true); return; }
    status(`${ids.length} scenes loaded`);
    $('save').disabled = true;
    open(ids[0]);
  }

  // ---------- validate (same rules as validate.html) ----------
  function validate() {
    const F = { error: [], warn: [], info: [] };
    const add = (l, m, s) => F[l].push({ m, s });
    const bc = {}, ref = {}, links = {};
    for (const id of ids) {
      const { sc, desc } = S[id];
      if (!sc) { add('error', `scene file missing: ${id}`, id); links[id] = []; continue; }
      links[id] = [];
      for (const o of sc.objects || []) for (const a of o.actions || [])
        if (a.type === 'goto') links[id].push({ to: a.scene, yaw: o.location.yaw, v: o.variant });
      const or = desc && desc.orientation;
      if (!desc) add('error', `descriptor missing: ${id}`, id);
      else if (!or || or.bearingOfCenter == null) add('error', `no bearing: ${id}`, id);
      else { bc[id] = or.bearingOfCenter; ref[id] = or.reference; }
    }
    for (const a of ids) for (const l of links[a]) if (!ids.includes(l.to)) add('error', `${a} → ${l.to}: target not in this tour`, a);
    const refs = [...new Set(Object.values(ref))];
    if (refs.length > 1) add('error', `mixed bearing references: ${refs.join(', ')}`);
    const reach = s => { const seen = new Set([s]), st = [s];
      while (st.length) for (const l of links[st.pop()] || []) if (ids.includes(l.to) && !seen.has(l.to)) { seen.add(l.to); st.push(l.to); }
      return seen; };
    const start = $('start').value.trim() || ids[0];
    if (!ids.includes(start)) add('error', `start scene not in tour: ${start}`);
    else { const r = reach(start);
      for (const id of ids) { if (!r.has(id)) add('error', `unreachable from start: ${id}`, id);
        else if (!reach(id).has(start)) add('error', `dead end (no way back): ${id}`, id); } }
    const first = {}; let oneWay = 0, checked = 0;
    for (const a of ids) for (const l of links[a]) if (!first[a + '|' + l.to]) first[a + '|' + l.to] = l;
    for (const k in first) { const [a, b] = k.split('|'); if (ids.includes(b) && !first[b + '|' + a]) oneWay++; }
    for (const a of ids) for (const b of ids) {
      if (!(a < b)) continue;
      const x = first[a + '|' + b], y = first[b + '|' + a];
      if (!x || !y || bc[a] == null || bc[b] == null || x.v === 'stairs' || y.v === 'stairs') continue;
      checked++;
      const r = wrap(bc[b] - bc[a] - wrap(x.yaw - y.yaw - 180));
      const lim = (x.v === 'door' || y.v === 'door' || x.v === 'room' || y.v === 'room') ? 45 : 15;
      if (Math.abs(r) > 150) add('error', `${a} ↔ ${b}: ${r.toFixed(0)}° residual, bearing probably flipped`, a);
      else if (Math.abs(r) > lim) add('warn', `${a} ↔ ${b}: ${r.toFixed(1)}° (limit ${lim}°)`, a);
    }
    add('info', `${Object.keys(bc).length}/${ids.length} with a bearing · ${checked} pairs checked · ${oneWay} one-way links`);
    const box = $('findings'); box.innerHTML = '';
    for (const [lvl, name] of [['error', 'Errors'], ['warn', 'Warnings'], ['info', 'Info']]) {
      const h = document.createElement('h3'); h.className = lvl; h.textContent = `${name} (${F[lvl].length})`; box.appendChild(h);
      if (!F[lvl].length) { const p = document.createElement('div'); p.className = 'ok'; p.textContent = 'none'; box.appendChild(p); }
      for (const f of F[lvl]) { const d = document.createElement('div'); d.className = 'f'; d.textContent = f.m;
        if (f.s) d.onclick = () => open(f.s); box.appendChild(d); }
    }
    renderList();
  }

  // ---------- UI ----------
  function renderList() {
    const el = $('list'); el.innerHTML = '';
    for (const id of ids) {
      const d = document.createElement('div'); if (id === cur) d.className = 'on';
      const b = S[id].desc && S[id].desc.orientation && S[id].desc.orientation.bearingOfCenter;
      const name = document.createElement('span'); name.textContent = (dirty.has(id) || dirtyScenes.has(id) ? '● ' : '') + nameOf(id); d.title = id;
      const tag = document.createElement('span'); tag.className = b == null ? 'nb' : 'b'; tag.textContent = b == null ? 'no bearing' : b.toFixed(0) + '°';
      d.append(name, tag); d.onclick = () => open(id); el.appendChild(d);
    }
    const sel = $('pano'); sel.innerHTML = '';
    for (const id of ids) { const op = document.createElement('option'); op.value = id; op.textContent = nameOf(id); op.title = id; op.selected = id === cur; sel.appendChild(op); }
  }

  // Same arrival rules as scene-viewer.html: explicit arrival, then stairs, then keep the compass bearing.
  function arrivalYaw(src, o, dst) {
    if (o.arrival && o.arrival.yaw != null) return o.arrival.yaw;
    if (o.variant === 'stairs') {
      const back = ((S[dst].sc && S[dst].sc.objects) || []).find(x => (x.actions || []).some(a => a.type === 'goto' && a.scene === src));
      return back ? wrap(back.location.yaw + 180) : 0;
    }
    const a = S[src].desc && S[src].desc.orientation, b = S[dst].desc && S[dst].desc.orientation;
    if (a && b && a.bearingOfCenter != null && b.bearingOfCenter != null && a.reference === b.reference && a.reference !== 'unknown')
      return wrap(a.bearingOfCenter + o.location.yaw - b.bearingOfCenter);
    return 0;
  }

  function open(id, yaw) {
    cur = id; picked = null; movingIdx = null; if (arrivalFor && id !== arrivalFor.target) arrivalFor = null; $('picked').textContent = 'click the panorama to pick a spot';
    const d = S[id] && S[id].desc;
    const o = d && d.orientation;
    $('cur').title = id; $('cur').textContent = nameOf(id) + (o && o.bearingOfCenter != null ? `  ·  center ${o.bearingOfCenter.toFixed(1)}° (${o.reference}, ${o.source})` : '  ·  no bearing');
    renderList(); renderHotspots();
    if (!d || d.coverage !== 'full') { $('msg').textContent = d ? 'partial pano: use orient-viewer.html' : 'descriptor missing'; return; }
    setLabel();
    const url = d.representations[0].url;
    if (!viewer) {
      viewer = new Viewer({ container: $('viewer'), panorama: url, navbar: ['zoom', 'fullscreen'], defaultZoomLvl: 30, defaultYaw: (yaw || 0) + 'deg', plugins: [[MarkersPlugin, {}]] });
      viewer.addEventListener('ready', () => { viewerReady = true; if (pendingDraw) pendingDraw(); }, { once: true });
      viewer.getPlugin(MarkersPlugin).addEventListener('select-marker', ({ marker }) => {
        if (!$('hophs').checked || movingIdx != null || arrivalFor) return;
        const o = S[cur].sc && S[cur].sc.objects[+marker.id.slice(1)];
        const g = o && (o.actions || []).find(a => a.type === 'goto');
        if (g && S[g.scene]) open(g.scene, arrivalYaw(cur, o, g.scene));
      });
      viewer.addEventListener('click', e => {
        picked = { yaw: wrap(deg(e.data.yaw)), pitch: deg(e.data.pitch) };
        if (arrivalFor) {
          const { src, idx } = arrivalFor; arrivalFor = null;
          const o = S[src].sc.objects[idx]; const tgt = cur;
          o.arrival = { yaw: +picked.yaw.toFixed(1) }; dirtyScenes.add(src);
          open(src); validate();
          status(`arrival set for ${nameOf(src)} → ${nameOf(tgt)}: face yaw ${o.arrival.yaw}° (not saved yet)`);
          return;
        }
        $('picked').textContent = `picked yaw ${picked.yaw.toFixed(1)}°, pitch ${picked.pitch.toFixed(1)}°`;
        if (matchMedia('(max-width: 800px)').matches && movingIdx == null) $('side').classList.add('open');
        if (movingIdx != null && S[cur].sc && S[cur].sc.objects[movingIdx]) {
          S[cur].sc.objects[movingIdx].location = { yaw: +picked.yaw.toFixed(1), pitch: +picked.pitch.toFixed(1) };
          movingIdx = null; touchScene();
        }
      });
    } else viewer.setPanorama(url, yaw != null ? { position: { yaw: yaw + 'deg', pitch: '0deg' } } : undefined);
    drawHotspots();
  }

  function apply() {
    const b = parseFloat($('bearing').value);
    if (!S[cur] || !S[cur].desc) { status('open a pano first', true); return; }
    if (!picked) { status('click the panorama on your landmark first', true); return; }
    if (isNaN(b)) { status('enter the bearing of that spot (or press N/E/S/W)', true); return; }
    const center = norm(b - picked.yaw);
    S[cur].desc.orientation = { bearingOfCenter: +center.toFixed(1), reference: $('ref').value, source: $('src').value, confidence: 'measured' };
    dirty.add(cur);
    status(`${cur}: center set to ${center.toFixed(1)}° (not saved yet)`);
    open(cur); validate();
  }

  // ---------- hotspots ----------
  const hs = () => ((S[cur] && S[cur].sc && S[cur].sc.objects) || []).map((o, i) => ({ o, i })).filter(x => (x.o.actions || []).some(a => a.type === 'goto'));
  const short = id => id.replace(/-pureshot.*$/, '');
  // description if one exists, else the scene title, else the short id. The file id stays available on hover or by tapping the label.
  const nameOf = id => {
    const x = S[id] || {};
    const d = (x.sc && x.sc.description) || (x.desc && x.desc.description);
    return (d && String(d).trim()) || (x.sc && x.sc.title) || short(id);
  };
  let showId = false;
  function setLabel() { if (!cur) return; const el = $('msg'); el.textContent = showId ? cur : nameOf(cur); el.title = cur; }
  function drawHotspots() {
    if (!viewer) return;
    const pl = viewer.getPlugin(MarkersPlugin);
    const list = hs().map(({ o, i }) => ({ id: 'h' + i, position: { yaw: o.location.yaw + 'deg', pitch: o.location.pitch + 'deg' },
      html: markerHTML(o.variant), size: { width: 32, height: 32 }, tooltip: nameOf((o.actions.find(a => a.type === 'goto') || {}).scene) }));
    const run = () => {
      try { pl.setMarkers(list); setLabel(); }
      catch (e) { console.error('markers failed', e); status('markers failed: ' + e.message, true); }
    };
    if (viewerReady) run(); else pendingDraw = run;
  }
  function touchScene() {
    dirtyScenes.add(cur); drawHotspots(); renderHotspots(); validate();
    status(`${cur}: hotspots changed (not saved yet)`);
  }
  function renderHotspots() {
    const box = $('hslist'); box.innerHTML = '';
    const sel = $('hstarget'); sel.innerHTML = '';
    for (const id of ids) if (id !== cur) { const op = document.createElement('option'); op.value = id; op.textContent = nameOf(id); op.title = id; sel.appendChild(op); }
    for (const { o, i } of hs()) {
      const g = o.actions.find(a => a.type === 'goto');
      const d = document.createElement('div'); d.className = 'f';
      d.title = g.scene; d.append(`→ ${nameOf(g.scene)} · ${o.variant || 'none'} · ${o.location.yaw.toFixed(0)}°`);
      const mv = document.createElement('button'); mv.className = 'sec'; mv.textContent = movingIdx === i ? 'click pano…' : 'Move';
      mv.onclick = () => { movingIdx = movingIdx === i ? null : i; $('side').classList.remove('open'); renderHotspots(); };
      const del = document.createElement('button'); del.className = 'sec'; del.textContent = 'Delete';
      del.onclick = () => { S[cur].sc.objects.splice(i, 1); movingIdx = null; touchScene(); };
      const ar = document.createElement('button'); ar.className = 'sec'; ar.textContent = o.arrival ? 'Arrival ✓' : 'Arrival';
      ar.title = 'Set which way you face on arriving';
      ar.onclick = () => { arrivalFor = { src: cur, idx: i, target: g.scene }; $('side').classList.remove('open'); open(g.scene); status(`tap the direction you should face on arrival in ${nameOf(g.scene)}`); };
      d.append(mv, ar);
      if (o.arrival) { const cl = document.createElement('button'); cl.className = 'sec'; cl.textContent = '✕'; cl.title = 'Clear arrival';
        cl.onclick = () => { delete o.arrival; touchScene(); }; d.append(cl); }
      d.append(del); box.appendChild(d);
    }
  }
  function addHotspot() {
    if (!S[cur] || !S[cur].sc) return status('open a pano first', true);
    if (!picked) return status('click the panorama where the hotspot goes', true);
    const t = $('hstarget').value; if (!t) return status('no target scene', true);
    const objs = S[cur].sc.objects = S[cur].sc.objects || [];
    let id = 'to-' + t, n = 1; while (objs.some(o => o.id === id)) id = `to-${t}-${++n}`;
    objs.push({ id, label: (S[t].sc && S[t].sc.title) || t, type: 'portal', variant: $('hsvariant').value,
      location: { yaw: +picked.yaw.toFixed(1), pitch: +picked.pitch.toFixed(1) }, actions: [{ type: 'goto', scene: t }] });
    touchScene();
  }

  // ---------- save (GitHub contents API, same method as admin.html) ----------
  const b64 = s => btoa(unescape(encodeURIComponent(s)));
  async function save() {
    TOKEN = $('token').value.trim();
    if (!TOKEN) { status('paste a token first (kept in memory only)', true); return; }
    const base = `https://api.github.com/repos/${$('owner').value.trim()}/${$('repo').value.trim()}/contents/`;
    const H = { Authorization: 'token ' + TOKEN, Accept: 'application/vnd.github+json' };
    const put = async (path, obj, msg) => {
      const g = await fetch(base + path, { headers: H });
      if (!g.ok) throw new Error('read ' + g.status + (g.status === 401 || g.status === 403 ? ' (token rejected)' : ''));
      const sha = (await g.json()).sha;
      const p = await fetch(base + path, { method: 'PUT', headers: { ...H, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, content: b64(JSON.stringify(obj, null, 2)), sha, branch: 'main' }) });
      if (!p.ok) throw new Error((await p.json()).message || p.status);
    };
    const jobs = [...[...dirty].map(id => ['d', id]), ...[...dirtyScenes].map(id => ['s', id])];
    let done = 0;
    for (const [k, id] of jobs) {
      try {
        if (k === 'd') { await put(S[id].path, S[id].desc, `Set orientation: ${id}`); dirty.delete(id); }
        else { await put(`scenes/${id}.json`, S[id].sc, `Edit hotspots: ${id}`); dirtyScenes.delete(id); }
        done++; status(`saved ${done}…`);
      } catch (e) { status(`${id}: save failed: ${e.message}`, true); renderList(); return; }
    }
    renderList(); status(`saved ${done} file(s) to GitHub (your local folder is unchanged)`);
  }

  // ---------- wiring ----------
  $('load').onclick = () => $('tour').value.trim() && loadTour($('tour').value.trim()).then(validate);
  $('apply').onclick = apply;
  $('msg').onclick = () => { showId = !showId; setLabel(); };
  $('hsadd').onclick = addHotspot;
  $('save').onclick = save;
  $('start').onchange = validate;
  $('prev').onclick = () => { const i = ids.indexOf(cur); if (i > 0) open(ids[i - 1]); };
  $('next').onclick = () => { const i = ids.indexOf(cur); if (i >= 0 && i < ids.length - 1) open(ids[i + 1]); };
  document.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { $('bearing').value = b.dataset.b; });
  document.addEventListener('input', () => { $('save').disabled = dirty.size === 0 && dirtyScenes.size === 0; });
  const q = new URLSearchParams(location.search).get('t');
  if (q) { $('tour').value = q; $('load').click(); }
  $('menubtn').onclick = () => document.querySelector('header').classList.toggle('showadv');
  $('sheethandle').onclick = () => $('side').classList.toggle('open');
  $('pano').onchange = () => open($('pano').value);
  $('mprev').onclick = () => $('prev').click();
  $('mnext').onclick = () => $('next').click();
  if (!q) document.querySelector('header').classList.add('showadv');
  setInterval(() => {
    const n = dirty.size + dirtyScenes.size;
    $('save').disabled = n === 0;
    $('sheethandle').textContent = (cur ? nameOf(cur) : 'no pano') + (picked ? ' · spot picked' : ' · tap the pano') + (n ? ` · ${n} unsaved` : '') + '   ▲';
  }, 500);
</script>
</body>
</html>
